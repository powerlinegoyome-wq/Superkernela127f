name: Build SuperKernel A127F

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  build-kernel:
    name: Compile Kernel & Release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: physwizz/A127f-T-sc
          ref: ksu-1.0.1
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio zip unzip tar wget curl ca-certificates rsync kmod ccache libncurses5 libncurses5-dev libtinfo5 binutils-aarch64-linux-gnu || sudo apt-get install -y libncurses6 libncurses-dev binutils-aarch64-linux-gnu
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 2>/dev/null || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 2>/dev/null || true

      - name: Fix DTC Build for GCC 10+
        run: |
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l || true

      - name: Patch Kernel Defaults (Permanent ZSTD & BFQ Lock)
        run: |
          echo "Applying ZRAM ZSTD default and init.rc override protection..."
          python3 -c '
          with open("drivers/block/zram/zram_drv.c", "r") as f:
              c = f.read()
          c = c.replace("static const char *default_compressor = \"lz4\";", "static const char *default_compressor = \"zstd\";")
          old_zcomp = "if (!zcomp_available_algorithm(compressor))"
          new_zcomp = "if (sysfs_streq(compressor, \"lz4\") || !strcmp(compressor, \"lz4\"))\n\t\treturn len;\n\n\tif (!zcomp_available_algorithm(compressor))"
          assert old_zcomp in c, "old_zcomp not found"
          c = c.replace(old_zcomp, new_zcomp, 1)
          with open("drivers/block/zram/zram_drv.c", "w") as f:
              f.write(c)
          print("ZRAM ZSTD patch applied!")
          '

          echo "Applying BFQ default and init.rc override protection..."
          python3 -c '
          with open("block/elevator.c", "r") as f:
              c = f.read()
          old_mq = "e = elevator_get(q, \"mq-deadline\", false);"
          new_mq = "#ifdef CONFIG_IOSCHED_BFQ\n\te = elevator_get(q, \"bfq\", false);\n\tif (!e)\n#endif\n\te = elevator_get(q, \"mq-deadline\", false);"
          assert old_mq in c, "old_mq not found"
          c = c.replace(old_mq, new_mq, 1)

          old_store = "if (!(q->mq_ops || q->request_fn) || !elv_support_iosched(q))\n\t\treturn count;\n\n\tret = __elevator_change(q, name);"
          new_store = "if (!(q->mq_ops || q->request_fn) || !elv_support_iosched(q))\n\t\treturn count;\n\n#ifdef CONFIG_IOSCHED_BFQ\n\tif (!strncasecmp(name, \"mq-deadline\", 11) || !strncasecmp(name, \"deadline\", 8))\n\t\treturn count;\n#endif\n\n\tret = __elevator_change(q, name);"
          assert old_store in c, "old_store not found"
          c = c.replace(old_store, new_store, 1)
          with open("block/elevator.c", "w") as f:
              f.write(c)
          print("Elevator BFQ patch applied!")
          '

          echo "Patching block/Kconfig.iosched for default BFQ..."
          python3 -c '
          with open("block/Kconfig.iosched", "r") as f:
              c = f.read()
          c = c.replace("default DEFAULT_CFQ", "default DEFAULT_BFQ")
          c = c.replace("default \"noop\" if DEFAULT_NOOP", "default \"bfq\" if DEFAULT_BFQ\n\tdefault \"noop\" if DEFAULT_NOOP")
          c = c.replace("config DEFAULT_NOOP\n\t\tbool \"No-op\"", "config DEFAULT_BFQ\n\t\tbool \"BFQ\" if IOSCHED_BFQ=y\n\n\tconfig DEFAULT_NOOP\n\t\tbool \"No-op\"")
          with open("block/Kconfig.iosched", "w") as f:
              f.write(c)
          print("Kconfig.iosched BFQ patch applied!")
          '

          echo "=== VERIFYING GIT DIFF ==="
          git diff drivers/block/zram/zram_drv.c block/elevator.c block/Kconfig.iosched

      - name: Setup KernelSU
        run: |
          echo "Setting up KernelSU at Physwizz tested commit..."
          rm -rf KernelSU drivers/kernelsu
          git clone https://github.com/tiann/KernelSU.git KernelSU
          cd KernelSU
          git checkout b766b98513b5a7eb33bc1c4a76b5702bf1288f07
          cd ..
          # Prevent Linux 4.19 syntax error on MODULE_IMPORT_NS
          sed -i 's/^MODULE_IMPORT_NS/\/\/ MODULE_IMPORT_NS/' KernelSU/kernel/ksu.c || true
          ln -sf ../KernelSU/kernel drivers/kernelsu

      - name: Setup WireGuard
        run: |
          echo "Setting up WireGuard..."
          if [ -d "wireguard-linux-compat" ]; then
            rm -rf wireguard-linux-compat
          fi
          git clone --depth=1 https://github.com/WireGuard/wireguard-linux-compat.git wireguard-linux-compat
          bash wireguard-linux-compat/kernel-tree-scripts/jury-rig.sh .
          rm -f net/wireguard
          cp -r wireguard-linux-compat/src net/wireguard

      - name: Setup Toolchain Symlinks & Permissions
        run: |
          chmod +x -R toolchain/
          GCC_BIN="$(pwd)/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin"
          # Only create cross-prefixed symlinks; NEVER create plain 'as' or 'ld' to avoid breaking HOSTCC
          rm -f "$GCC_BIN/as" "$GCC_BIN/ld"
          ln -sf aarch64-linux-android-as "$GCC_BIN/aarch64-linux-gnu-as"
          ln -sf aarch64-linux-android-ld "$GCC_BIN/aarch64-linux-gnu-ld"

      - name: Apply Optimizations to Defconfig
        run: |
          DEFCONFIG="arch/arm64/configs/exynos850-a12snsxx_defconfig"
          echo "Applying optimizations to $DEFCONFIG..."

          # 1. ZSTD ZRAM support
          sed -i 's/# CONFIG_CRYPTO_ZSTD is not set/CONFIG_CRYPTO_ZSTD=y/' $DEFCONFIG
          grep -q "CONFIG_CRYPTO_ZSTD=y" $DEFCONFIG || echo "CONFIG_CRYPTO_ZSTD=y" >> $DEFCONFIG

          # 2. Google BBR default TCP
          sed -i 's/# CONFIG_DEFAULT_BBR is not set/CONFIG_DEFAULT_BBR=y/' $DEFCONFIG
          sed -i 's/CONFIG_DEFAULT_TCP_CONG="bic"/CONFIG_DEFAULT_TCP_CONG="bbr"/' $DEFCONFIG
          sed -i 's/CONFIG_DEFAULT_TCP_CONG="cubic"/CONFIG_DEFAULT_TCP_CONG="bbr"/' $DEFCONFIG

          # 3. NTFS Read/Write
          sed -i 's/# CONFIG_NTFS_RW is not set/CONFIG_NTFS_RW=y/' $DEFCONFIG

          # 4. BFQ I/O Scheduler & Default
          sed -i 's/# CONFIG_IOSCHED_BFQ is not set/CONFIG_IOSCHED_BFQ=y/' $DEFCONFIG
          grep -q "CONFIG_IOSCHED_BFQ=y" $DEFCONFIG || echo "CONFIG_IOSCHED_BFQ=y" >> $DEFCONFIG
          grep -q "CONFIG_DEFAULT_BFQ=y" $DEFCONFIG || echo "CONFIG_DEFAULT_BFQ=y" >> $DEFCONFIG
          grep -q 'CONFIG_DEFAULT_IOSCHED="bfq"' $DEFCONFIG || echo 'CONFIG_DEFAULT_IOSCHED="bfq"' >> $DEFCONFIG

          # 5. WireGuard Support
          sed -i 's/# CONFIG_WIREGUARD is not set/CONFIG_WIREGUARD=y/' $DEFCONFIG
          grep -q "CONFIG_WIREGUARD=y" $DEFCONFIG || echo "CONFIG_WIREGUARD=y" >> $DEFCONFIG

          # 6. KernelSU Support
          sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/' $DEFCONFIG
          grep -q "CONFIG_KSU=y" $DEFCONFIG || echo "CONFIG_KSU=y" >> $DEFCONFIG

      - name: Compile Kernel
        run: |
          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export ARCH=arm64
          
          # Add in-tree toolchains to PATH
          TOOLCHAIN_GCC="$(pwd)/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin"
          TOOLCHAIN_CLANG="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin"
          export PATH="$TOOLCHAIN_CLANG:$TOOLCHAIN_GCC:$PATH"
          export CROSS_COMPILE=aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          make ARCH=arm64 exynos850-a12snsxx_defconfig
          make ARCH=arm64 HOSTCFLAGS="-fcommon" KCFLAGS="-Wno-error -Wno-gnu-variable-sized-type-not-at-end" -j$(nproc --all)

      - name: Package with AnyKernel3
        run: |
          echo "Setting up proven AnyKernel3 from Physwizz A127F..."
          wget -q https://github.com/physwizz/A127f-T-sc/releases/download/Rksu2/physwizz_A127f-T-sc-rksu-v2-kernel.zip -O ak3_base.zip
          unzip -q ak3_base.zip -d AnyKernel3
          rm -f AnyKernel3/Image AnyKernel3/Image.gz
          
          # Replace kernel.string in anykernel.sh
          sed -i 's/kernel.string=.*/kernel.string=SuperKernel A127F (KSU + WG + ZSTD-Lock + BFQ-Lock) by powerlinegoyome/' AnyKernel3/anykernel.sh
          
          # Copy compiled Image
          if [ -f "arch/arm64/boot/Image" ]; then
            cp arch/arm64/boot/Image AnyKernel3/Image
          elif [ -f "arch/arm64/boot/Image.gz" ]; then
            cp arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          fi

          cd AnyKernel3
          zip -r9 ../SuperKernel-A127F-v1.4-KSU-WG-ZSTD.zip * -x .git README.md
          cd ..

          mkdir -p dist
          cp SuperKernel-A127F-v1.4-KSU-WG-ZSTD.zip dist/
          [ -f arch/arm64/boot/Image ] && cp arch/arm64/boot/Image dist/
          [ -f arch/arm64/boot/Image.gz ] && cp arch/arm64/boot/Image.gz dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SuperKernel-A127F-v1.4-Package
          path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4-ksu-wg-zstd-bfq
          name: "SuperKernel A127F v1.4 (Permanent ZSTD & BFQ Lock + KSU + WireGuard)"
          body: |
            ### SuperKernel A127F v1.4 (Samsung Galaxy A12s / SM-A127F)
            Built automatically via GitHub Actions CI!
            
            **Permanent Defaults in v1.4:**
            - **ZRAM ZSTD Lock**: `zram_drv.c` default compressor set to `zstd`. Android `init.rc` attempts to overwrite with `lz4` are safely ignored by sysfs.
            - **BFQ I/O Lock**: `block/elevator.c` BLK-MQ default scheduler set to `bfq`. Android `init.rc` attempts to overwrite with `mq-deadline` are safely ignored.
            - **KernelSU v1.0.1 Active Root**: Live syscall hooks in `fs/exec.c`, `fs/open.c`, `fs/read_write.c`, `fs/stat.c`.
            - **WireGuard In-Kernel VPN**: `CONFIG_WIREGUARD=y` for battery-friendly, zero-overhead VPN.
            - **Google BBR TCP**: Default TCP congestion control.
            - **NTFS Read/Write**: `CONFIG_NTFS_RW=y`.

            #### Installation:
            Flash `SuperKernel-A127F-v1.4-KSU-WG-ZSTD.zip` in TWRP or OrangeFox recovery.
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
